name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api
          args: --tests=false ./...

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      GOMAXPROCS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install gosec and govulncheck
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: gosec
        run: "$(go env GOPATH)/bin/gosec" ./...
      - name: govulncheck
        run: "$(go env GOPATH)/bin/govulncheck" ./...

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: go mod verify
        run: go mod verify

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: go test
        env:
          CI: "true"
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out

  assets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check assets
        run: python3 scripts/check_assets.py

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: go build
        run: GOOS=linux GOARCH=amd64 go build -o bitown-api ./cmd/bitown/
