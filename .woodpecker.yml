when:
  - event: [push, pull_request]

steps:
  lint:
    image: golangci/golangci-lint:latest
    directory: api
    commands:
      - golangci-lint run ./...

  test:
    image: golang:1.25-bookworm
    directory: api
    commands:
      - go test ./...

  build:
    image: golang:1.25-bookworm
    directory: api
    commands:
      - GOOS=linux GOARCH=amd64 go build -o bitown-api ./cmd/bitown/
